<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo リスト</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-100 to-blue-50 min-h-screen">

  <div class="max-w-6xl mx-auto px-4 py-8">
    <!-- Month Navigation -->
    <div class="flex items-center justify-between mb-6">
      <button id="prevMonth"
        class="w-10 h-10 flex items-center justify-center rounded-full bg-white shadow-sm
               hover:shadow-md text-gray-500 hover:text-gray-800 transition-all text-xl
               font-light select-none">‹</button>
      <h1 id="monthTitle" class="text-2xl font-bold text-gray-800 tracking-wide"></h1>
      <button id="nextMonth"
        class="w-10 h-10 flex items-center justify-center rounded-full bg-white shadow-sm
               hover:shadow-md text-gray-500 hover:text-gray-800 transition-all text-xl
               font-light select-none">›</button>
    </div>

    <!-- Three-column layout: calendar | todos | notifications -->
    <div class="flex flex-col lg:flex-row gap-6 items-start">
      <aside id="calendarSidebar" class="w-full lg:w-64 flex-shrink-0"></aside>
      <div id="content" class="flex-1 min-w-0"></div>
      <aside id="notificationPanel" class="w-full lg:w-56 flex-shrink-0"></aside>
    </div>
  </div>

  <!-- Settings button (fixed bottom-right) -->
  <button id="settingsBtn"
    class="fixed bottom-6 right-6 w-12 h-12 bg-white rounded-full shadow-lg hover:shadow-xl
           flex items-center justify-center text-gray-600 hover:text-gray-900
           transition-all text-xl z-40">⚙️</button>

  <!-- Settings modal -->
  <div id="settingsModal"
    class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-50
           flex items-center justify-center p-4">
    <div id="settingsPanel" class="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6"></div>
  </div>

  <!-- Auth overlay (shown when not signed in) -->
  <div id="authOverlay"
    class="fixed inset-0 bg-gradient-to-br from-slate-100 to-blue-50 z-50
           flex items-center justify-center">
    <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-sm text-center">
      <div class="text-5xl mb-4">📋</div>
      <h1 class="text-2xl font-bold text-gray-800 mb-1">Todo リスト</h1>
      <p class="text-sm text-gray-500 mb-6">サインインして複数デバイスで同期</p>
      <button id="googleSignIn"
        class="w-full flex items-center justify-center gap-3 border border-gray-200
               hover:bg-gray-50 rounded-xl px-4 py-3 transition-colors
               text-sm font-medium text-gray-700">
        <svg width="18" height="18" viewBox="0 0 18 18">
          <path fill="#4285F4" d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 0 0 2.38-5.88c0-.57-.05-.66-.15-1.18z"/>
          <path fill="#34A853" d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2a4.8 4.8 0 0 1-7.18-2.54H1.83v2.07A8 8 0 0 0 8.98 17z"/>
          <path fill="#FBBC05" d="M4.5 10.52a4.8 4.8 0 0 1 0-3.04V5.41H1.83a8 8 0 0 0 0 7.18l2.67-2.07z"/>
          <path fill="#EA4335" d="M8.98 4.18c1.17 0 2.23.4 3.06 1.2l2.3-2.3A8 8 0 0 0 1.83 5.4L4.5 7.49a4.77 4.77 0 0 1 4.48-3.31z"/>
        </svg>
        Googleでサインイン
      </button>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
