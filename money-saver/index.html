<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Money Lifter</title>
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    html,body{width:100%;height:100%;overflow:hidden;}
    body{background:#060606;font-family:'Helvetica Neue',Arial,'Hiragino Kaku Gothic ProN',sans-serif;touch-action:manipulation;}

    /* ── START SCREEN ── */
    #s-start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0a0a0a;}
    .ss-bg{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 24px,rgba(200,150,42,.04) 24px,rgba(200,150,42,.04) 25px),repeating-linear-gradient(90deg,transparent,transparent 24px,rgba(200,150,42,.04) 24px,rgba(200,150,42,.04) 25px);}
    .ss-inner{position:relative;z-index:1;width:min(380px,94vw);display:flex;flex-direction:column;align-items:center;gap:16px;}
    .ss-title{font-size:clamp(1.6rem,7vw,2.2rem);font-weight:900;color:#d4aa55;text-shadow:0 2px 20px rgba(212,170,85,.45);letter-spacing:.06em;}
    .ss-sub{color:rgba(255,255,255,.45);font-size:.82rem;text-align:center;line-height:1.6;}
    .ss-list{width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(212,170,85,.18);border-radius:12px;padding:14px 18px;display:flex;flex-direction:column;gap:8px;}
    .ss-item{display:flex;align-items:center;justify-content:space-between;color:#fff;font-size:.88rem;}
    .ss-item-name{color:rgba(255,255,255,.7);}
    .ss-item-cd{font-size:.72rem;padding:2px 8px;border-radius:10px;font-weight:600;}
    .cd-easy{background:rgba(80,200,80,.18);color:#80d880;border:1px solid rgba(80,200,80,.3);}
    .cd-mid {background:rgba(200,200,80,.18);color:#d8d880;border:1px solid rgba(200,200,80,.3);}
    .cd-hard{background:rgba(200,80,80,.18);color:#d88080;border:1px solid rgba(200,80,80,.3);}
    .cd-xhard{background:rgba(180,40,40,.3);color:#ff6060;border:1px solid rgba(180,40,40,.5);}
    .ss-note{color:rgba(255,255,255,.35);font-size:.72rem;text-align:center;line-height:1.5;}
    #btn-start{width:100%;padding:18px;border:none;border-radius:12px;background:linear-gradient(135deg,#d4aa55,#b08820);color:#0d0800;font-size:1.25rem;font-weight:900;cursor:pointer;letter-spacing:.06em;box-shadow:0 6px 28px rgba(212,170,85,.28);-webkit-tap-highlight-color:transparent;transition:transform .1s;}
    #btn-start:active{transform:scale(.96);}

    /* ── APP SCREEN ── */
    #s-app{position:fixed;inset:0;display:none;overflow:hidden;}
    #lift-bar{position:absolute;right:13px;top:50%;transform:translateY(-50%);z-index:3;display:flex;flex-direction:column;align-items:center;gap:5px;}
    #lift-track{width:10px;height:140px;background:rgba(0,0,0,.55);border:1px solid rgba(212,170,85,.22);border-radius:6px;position:relative;overflow:hidden;}
    #lift-fill{position:absolute;bottom:0;width:100%;background:linear-gradient(to top,#d4aa55,#ff9900);border-radius:6px;transition:height .06s;}
    #lift-lbl{color:rgba(255,255,255,.4);font-size:.56rem;text-align:center;}
    #info-box{position:absolute;left:13px;top:50%;transform:translateY(-50%);z-index:3;background:rgba(0,0,0,.75);border:1px solid rgba(212,170,85,.22);border-radius:10px;padding:9px 10px;text-align:center;min-width:58px;}
    #info-val{color:#d4aa55;font-size:1rem;font-weight:700;}
    #info-cd{color:rgba(255,255,255,.4);font-size:.58rem;margin-top:2px;}
    #status{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:3;background:rgba(0,0,0,.78);border:1px solid rgba(255,255,255,.11);border-radius:20px;padding:7px 18px;color:#fff;font-size:.82rem;white-space:nowrap;max-width:90vw;text-align:center;}
    #pinch-dot{position:absolute;z-index:4;width:28px;height:28px;border-radius:50%;border:2.5px solid #d4aa55;background:rgba(212,170,85,.18);transform:translate(-50%,-50%);display:none;pointer-events:none;box-shadow:0 0 12px rgba(212,170,85,.4);}
    #btn-back{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);z-index:5;background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.18);border-radius:22px;color:rgba(255,255,255,.8);font-size:.9rem;padding:9px 26px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
    #loading-ovl{position:absolute;inset:0;z-index:10;background:rgba(0,0,0,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;font-size:.88rem;}
    .spinner{width:44px;height:44px;border:4px solid rgba(212,170,85,.18);border-top-color:#d4aa55;border-radius:50%;animation:spin .9s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .hidden{display:none!important;}
  </style>
</head>
<body>

<!-- ════ START SCREEN ════ -->
<div id="s-start">
  <div class="ss-bg"></div>
  <div class="ss-inner">
    <div class="ss-title">💰 Money Lifter</div>
    <div class="ss-sub">傾けて転がす・ピンチで持ち上げる<br>お財布の中の世界を体験しよう</div>
    <div class="ss-list">
      <div class="ss-item"><span class="ss-item-name">100円玉 × 3</span><span class="ss-item-cd cd-mid">普通に持てる</span></div>
      <div class="ss-item"><span class="ss-item-name">500円玉 × 2</span><span class="ss-item-cd cd-hard">少し重い</span></div>
      <div class="ss-item"><span class="ss-item-name">1,000円札 × 1</span><span class="ss-item-cd cd-easy">軽い・すぐ持てる</span></div>
      <div class="ss-item"><span class="ss-item-name">10,000円札 × 1</span><span class="ss-item-cd cd-xhard">ずっしり…重い</span></div>
    </div>
    <div class="ss-note">📱 スマホを傾けるとお金が転がります<br>👆 ピンチジェスチャーでつかめます</div>
    <button id="btn-start">財布を開く →</button>
  </div>
</div>

<!-- ════ APP SCREEN ════ -->
<div id="s-app">
  <div id="lift-bar"><div id="lift-track"><div id="lift-fill" style="height:0%"></div></div><div id="lift-lbl">LIFT</div></div>
  <div id="info-box"><div id="info-val">---</div><div id="info-cd"></div></div>
  <div id="status">起動中...</div>
  <div id="pinch-dot"></div>
  <button id="btn-back">← 閉じる</button>
  <div id="loading-ovl"><div class="spinner"></div><div>財布を準備中...</div></div>
</div>

<!-- ── Libraries ── -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js" crossorigin="anonymous"></script>

<script>
'use strict';

/* ═══════════════════════════════════════
   OBJECT DEFINITIONS
   cdRatio: 持ち上げCD比（小さいほど重い）
═══════════════════════════════════════ */
/* 実物の比率に合わせたサイズ（1unit≒27mm、財布内寸との比を現実に近づける） */
const OBJ_DEFS = [
  { type:'coin', value:100,   label:'100円',   r:.30, h:.055, mass:.5,  cdRatio:.90, ldam:.35, adam:.45 },
  { type:'coin', value:100,   label:'100円',   r:.30, h:.055, mass:.5,  cdRatio:.90, ldam:.35, adam:.45 },
  { type:'coin', value:100,   label:'100円',   r:.30, h:.055, mass:.5,  cdRatio:.90, ldam:.35, adam:.45 },
  { type:'coin', value:500,   label:'500円',   r:.35, h:.065, mass:2.0, cdRatio:.50, ldam:.40, adam:.50 },
  { type:'coin', value:500,   label:'500円',   r:.35, h:.065, mass:2.0, cdRatio:.50, ldam:.40, adam:.50 },
  { type:'bill', value:1000,  label:'1,000円', bw:1.35, bd:0.78, h:.03, mass:.07, cdRatio:1.10, ldam:.70, adam:.88 },
  { type:'bill', value:10000, label:'壱万円',  bw:1.45, bd:0.84, h:.03, mass:.07, cdRatio:.06, ldam:.70, adam:.88 },
];

const BASE_LIFT = 1.8; // world units, max possible lift
let W=3.0, D=5.0;      // 財布内寸 — startApp() で画面アスペクト比から再計算
const WH=0.95;
const WALL_MARGIN=.45; // 画面縁に壁・ファスナーが収まる余白

/* ── DOM ── */
const sStart    = document.getElementById('s-start');
const sApp      = document.getElementById('s-app');
const statusEl  = document.getElementById('status');
const pinchDot  = document.getElementById('pinch-dot');
const liftFill  = document.getElementById('lift-fill');
const infoVal   = document.getElementById('info-val');
const infoCd    = document.getElementById('info-cd');
const loadingOvl= document.getElementById('loading-ovl');

/* ── Three.js ── */
let scene3, cam3, renderer3;
/* ── Cannon.js ── */
let physWorld;
/* ── Objects ── */
let physObjs = []; // {def, body, mesh, origMass}
/* ── Grab state ── */
let grabbed     = null; // {obj, grabHandSz, baseY}
let wasPinching = false;
let pinchStreak = 0;
let pinchSX=0, pinchSY=0;
let liftFrac=0, liftFracRaw=0, animLift=0;
/* ── Gyro ── */
let rawBeta=90, rawGamma=0, smBeta=90, smGamma=0;
let gyroReady=false;
/* ── MediaPipe ── */
let mpHands=null, mpCam=null, hidVid=null, rafHandle=null;
let lastTs=0;

/* ══════════════════════════════════════
   START / STOP
══════════════════════════════════════ */
document.getElementById('btn-start').addEventListener('click', startApp);
document.getElementById('btn-back').addEventListener('click', stopApp);

function startApp() {
  physObjs=[]; grabbed=null; wasPinching=false; pinchStreak=0; liftFrac=0; animLift=0;
  rawBeta=smBeta=90; rawGamma=smGamma=0; lastTs=0;
  loadingOvl.classList.remove('hidden');
  statusEl.textContent='起動中...';
  infoVal.textContent='---'; infoCd.textContent='';
  sStart.style.display='none'; sApp.style.display='block';
  /* 財布内寸を画面アスペクト比に合わせる → 画面全体が財布の中になる */
  const aspect=innerWidth/innerHeight;
  D=5.0;
  W=Math.max(1.9,Math.min(4.6,((D/2+WALL_MARGIN)*aspect-WALL_MARGIN)*2));
  initScene();
  initPhysics();
  createObjects();
  initGyro();
  initMP();
  rafHandle=requestAnimationFrame(renderLoop);
  setTimeout(()=>loadingOvl.classList.add('hidden'),1500);
}

function stopApp() {
  cancelAnimationFrame(rafHandle); rafHandle=null;
  if(renderer3){renderer3.dispose();renderer3.domElement.remove();renderer3=null;}
  scene3=null; cam3=null;
  if(mpCam){try{mpCam.stop();}catch(_){} mpCam=null;}
  if(hidVid){try{hidVid.srcObject&&hidVid.srcObject.getTracks().forEach(t=>t.stop());}catch(_){}hidVid.remove();hidVid=null;}
  if(mpHands){try{mpHands.close();}catch(_){} mpHands=null;}
  physWorld=null; physObjs=[];
  sApp.style.display='none'; sStart.style.display='flex';
}

/* ══════════════════════════════════════
   THREE.JS SCENE
══════════════════════════════════════ */
function initScene() {
  scene3=new THREE.Scene();
  scene3.background=new THREE.Color(0x050505);

  cam3=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,40);
  fitCamera();

  renderer3=new THREE.WebGLRenderer({antialias:true});
  renderer3.setSize(innerWidth,innerHeight);
  renderer3.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer3.toneMapping=THREE.ACESFilmicToneMapping;
  renderer3.toneMappingExposure=1.15;
  renderer3.shadowMap.enabled=true;
  renderer3.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer3.domElement.style.cssText='position:absolute;inset:0;z-index:0;';
  sApp.insertBefore(renderer3.domElement,sApp.firstChild);

  /* Lighting */
  scene3.add(new THREE.AmbientLight(0xffd0a0,.45));
  const sun=new THREE.DirectionalLight(0xfff5e0,1.6); sun.position.set(1.5,7,3);
  sun.castShadow=true;
  sun.shadow.mapSize.set(1024,1024);
  sun.shadow.camera.left=-4; sun.shadow.camera.right=4;
  sun.shadow.camera.top=4; sun.shadow.camera.bottom=-4;
  sun.shadow.camera.near=.5; sun.shadow.camera.far=16;
  scene3.add(sun);
  const fill=new THREE.PointLight(0xffb060,.9,12); fill.position.set(-1,4,3); scene3.add(fill);
  const glow=new THREE.PointLight(0xffd080,.5,7);  glow.position.set(0,1.5,0); scene3.add(glow);
  const rim=new THREE.PointLight(0xffc060,.35,10); rim.position.set(0,2.5,-3); scene3.add(rim);

  buildWallet();
  window.addEventListener('resize',()=>{
    if(!cam3||!renderer3) return;
    fitCamera();
    renderer3.setSize(innerWidth,innerHeight);
  });
}

/* 真上見下ろし。財布の縁（壁+ファスナー）がちょうど画面の縁に来る高さに置く */
function fitCamera() {
  const halfFrame=D/2+WALL_MARGIN;
  const camH=WH+halfFrame/Math.tan(cam3.fov*.5*Math.PI/180);
  cam3.aspect=innerWidth/innerHeight;
  cam3.up.set(0,0,-1);
  cam3.position.set(0,camH,0);
  cam3.lookAt(0,0,0);
  cam3.updateProjectionMatrix();
}

/* ── Procedural textures ── */
function makeLeatherTex() {
  const c=document.createElement('canvas'); c.width=c.height=512;
  const ctx=c.getContext('2d');
  ctx.fillStyle='#0d0d0d'; ctx.fillRect(0,0,512,512);
  const rng=i=>{let s=Math.sin(i*91.3+7)*43758.5;return s-Math.floor(s);};
  for(let i=0;i<18000;i++){
    const x=rng(i)*512,y=rng(i+700)*512,a=rng(i+1400)*.11;
    ctx.fillStyle=rng(i+2100)>.6?`rgba(90,80,70,${a})`:`rgba(0,0,0,${a*2.5})`;
    ctx.fillRect(x,y,rng(i+2800)*2+.4,rng(i+3500)*1.2+.2);
  }
  for(let i=0;i<55;i++){
    const y=rng(i+4200)*512;
    ctx.beginPath(); ctx.moveTo(0,y);
    for(let x=8;x<512;x+=rng(i*7.3+x*.01)*14+5) ctx.lineTo(x,y+rng(i*13+x*.01)*2-1);
    ctx.strokeStyle=`rgba(0,0,0,${rng(i+5000)*.06})`; ctx.lineWidth=rng(i+5700)+.3; ctx.stroke();
  }
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(2,3);
  return t;
}

function makeInteriorTex() {
  /* 明るめの起毛ライニング — コインとのコントラストと影の視認性を確保 */
  const c=document.createElement('canvas'); c.width=c.height=256;
  const ctx=c.getContext('2d');
  ctx.fillStyle='#3a2c1c'; ctx.fillRect(0,0,256,256);
  for(let i=0;i<28000;i++){
    const v=Math.random();
    ctx.fillStyle=`rgba(${58+v*30|0},${44+v*24|0},${28+v*16|0},${Math.random()*.5})`;
    ctx.fillRect(Math.random()*256,Math.random()*256,1,1);
  }
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(4,6);
  return t;
}

/* ── Wallet geometry ── */
function buildWallet() {
  const lT=makeLeatherTex(), iT=makeInteriorTex();
  const lM=new THREE.MeshStandardMaterial({map:lT,color:0x181818,roughness:.88,metalness:.04});
  const iM=new THREE.MeshStandardMaterial({map:iT,color:0xffffff,roughness:.96,metalness:.0});
  const eM=new THREE.MeshStandardMaterial({color:0x222220,roughness:.82,metalness:.06});
  const zM=new THREE.MeshStandardMaterial({color:0xc8962a,metalness:.9,roughness:.18});
  const zR=new THREE.MeshStandardMaterial({color:0xb07e22,metalness:.85,roughness:.22});

  const hW=W/2,hD=D/2;
  const add=(g,m,x,y,z)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.receiveShadow=true;scene3.add(o);return o;};

  add(new THREE.BoxGeometry(W+.5,.28,D+.4),lM,0,-.14,0);                    // exterior base
  const fl=new THREE.Mesh(new THREE.PlaneGeometry(W-.2,D-.15),iM);          // interior floor
  fl.rotation.x=-Math.PI/2; fl.position.y=.004; fl.receiveShadow=true; scene3.add(fl);

  /* Walls */
  add(new THREE.BoxGeometry(W+.5,WH,.22),lM,0,WH/2,-(hD+.01));             // back
  add(new THREE.BoxGeometry(.22,WH,D+.4),lM,-(hW+.11),WH/2,0);             // left
  add(new THREE.BoxGeometry(.22,WH,D+.4),lM, (hW+.11),WH/2,0);             // right
  add(new THREE.BoxGeometry(W+.5,WH*.32,.22),lM,0,WH*.16,(hD+.01));         // front (short)

  /* Inner wall liner */
  const ip=(w,h,x,y,z,ry)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),iM);m.position.set(x,y,z);m.rotation.y=ry;m.receiveShadow=true;scene3.add(m);};
  ip(W-.1,WH,0,WH/2,-(hD-.12),0); ip(D-.1,WH,-(hW-.12),WH/2,0,Math.PI/2); ip(D-.1,WH,(hW-.12),WH/2,0,-Math.PI/2);

  /* Top trim */
  const tr=(x,y,z,tw,td)=>add(new THREE.BoxGeometry(tw,.07,td),eM,x,y,z);
  tr(0,WH+.035,-(hD+.01),W+.5,.22); tr(-(hW+.11),WH+.035,0,.22,D+.4); tr((hW+.11),WH+.035,0,.22,D+.4); tr(0,WH*.32+.035,(hD+.01),W+.5,.22);

  /* Zipper teeth (InstancedMesh) */
  const nT=65, toothI=new THREE.InstancedMesh(new THREE.BoxGeometry(.11,.065,.10),zM,nT*2);
  const dm=new THREE.Object3D(); let idx=0;
  for(let i=0;i<nT;i++){const z=-hD+.15+i*((D-.3)/nT)+(.5*(D-.3)/nT);for(const sx of[-1,1]){dm.position.set(sx*(hW+.11),WH+.11,z);dm.updateMatrix();toothI.setMatrixAt(idx++,dm.matrix);}}
  toothI.instanceMatrix.needsUpdate=true; scene3.add(toothI);

  /* Zipper rails */
  for(const sx of[-1,1]){const r=new THREE.Mesh(new THREE.BoxGeometry(.12,.07,D+.2),zR);r.position.set(sx*(hW+.11),WH+.07,0);scene3.add(r);}

  /* Zipper pull */
  add(new THREE.BoxGeometry(.2,.22,.44),zM,0,WH+.18,hD+.22);
  const pr=new THREE.Mesh(new THREE.TorusGeometry(.13,.04,8,16),zM); pr.rotation.x=Math.PI/2; pr.position.set(0,WH+.18,hD+.52); scene3.add(pr);
}

/* ── Coin texture ── */
function makeCoinTex(value) {
  const c=document.createElement('canvas'); c.width=c.height=256;
  const ctx=c.getContext('2d');
  const gold=value===500;
  const g=ctx.createRadialGradient(108,100,0,128,128,128);
  if(gold){g.addColorStop(0,'#f5d060');g.addColorStop(.65,'#d4aa35');g.addColorStop(1,'#8b6808');}
  else{g.addColorStop(0,'#f2f2f2');g.addColorStop(.65,'#c8c8c8');g.addColorStop(1,'#888888');}
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(128,128,119,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle=gold?'#9a7010':'#666'; ctx.lineWidth=7; ctx.beginPath(); ctx.arc(128,128,115,0,Math.PI*2); ctx.stroke();
  ctx.strokeStyle=gold?'#b08820':'#808080'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(128,128,96,0,Math.PI*2); ctx.stroke();
  ctx.fillStyle=gold?'#6a4810':'#404040';
  ctx.font=`bold ${value===500?62:56}px sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(value.toString(),128,120);
  ctx.font='22px sans-serif'; ctx.fillText('円',128,162);
  return new THREE.CanvasTexture(c);
}

/* ── Bill texture ── */
function makeBillTex(value) {
  const c=document.createElement('canvas'); c.width=560; c.height=350;
  const ctx=c.getContext('2d');
  const is10k=value===10000;
  ctx.fillStyle=is10k?'#c2aa80':'#a8c098'; ctx.fillRect(0,0,560,350);
  ctx.globalAlpha=.07; for(let i=0;i<12;i++){ctx.fillStyle='#000';ctx.fillRect(i*50,0,24,350);} ctx.globalAlpha=1;
  ctx.strokeStyle=is10k?'#5a3810':'#1a4820'; ctx.lineWidth=5; ctx.strokeRect(10,10,540,330);
  ctx.lineWidth=2; ctx.strokeRect(18,18,524,314);
  ctx.fillStyle=is10k?'rgba(70,44,8,.22)':'rgba(8,56,18,.18)';
  ctx.beginPath(); ctx.ellipse(115,175,62,88,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle=is10k?'#5a3810':'#1a4820'; ctx.lineWidth=1.5; ctx.stroke();
  ctx.fillStyle=is10k?'#3a2008':'#0a2e10';
  ctx.font='bold 74px serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(value.toLocaleString(),315,155);
  ctx.font='30px serif'; ctx.fillText('円',462,155);
  ctx.font='24px sans-serif'; ctx.fillText(is10k?'壱万円':'千円',315,218);
  ctx.font='15px monospace'; ctx.globalAlpha=.45; ctx.fillText('AB'+(Math.random()*1e8|0).toString().padStart(8,'0')+'C',220,295); ctx.globalAlpha=1;
  return new THREE.CanvasTexture(c);
}

/* ══════════════════════════════════════
   CANNON.JS PHYSICS
══════════════════════════════════════ */
function initPhysics() {
  physWorld=new CANNON.World();
  physWorld.gravity.set(0,-9.82,0);
  physWorld.broadphase=new CANNON.NaiveBroadphase();
  physWorld.solver.iterations=8;
  physWorld.allowSleep=true;

  const gM=new CANNON.Material('g'), oM=new CANNON.Material('o');
  physWorld.addContactMaterial(new CANNON.ContactMaterial(gM,oM,{friction:.42,restitution:.07}));
  physWorld.addContactMaterial(new CANNON.ContactMaterial(oM,oM,{friction:.35,restitution:.10}));

  /* Floor (plane, normal=+Y after rotation) */
  const fb=new CANNON.Body({mass:0,material:gM});
  fb.addShape(new CANNON.Plane());
  fb.quaternion.setFromAxisAngle(new CANNON.Vec3(1,0,0),-Math.PI/2);
  physWorld.addBody(fb);

  /* Walls — thick enough to stop fast-moving objects */
  const hw=W/2,hd=D/2;
  const wt=0.5; // half-thickness (thick walls prevent tunneling)
  const wall=(x,y,z,hx,hy,hz)=>{const b=new CANNON.Body({mass:0,material:gM});b.addShape(new CANNON.Box(new CANNON.Vec3(hx,hy,hz)));b.position.set(x,y,z);physWorld.addBody(b);};
  wall(-(hw+wt), WH/2+.1, 0, wt, WH/2+.3, hd+wt+.1);
  wall( (hw+wt), WH/2+.1, 0, wt, WH/2+.3, hd+wt+.1);
  wall(0, WH/2+.1, -(hd+wt), hw+wt+.1, WH/2+.3, wt);
  wall(0, WH/2+.1,  (hd+wt), hw+wt+.1, WH/2+.3, wt);
}

/* ── Gravity from gyro ── */
function updateGravity(beta,gamma) {
  const G=9.82*1.4;
  const bR=(beta-90)*Math.PI/180;
  const gR=gamma*Math.PI/180;
  physWorld.gravity.set(
    Math.sin(gR)*G,
    -Math.cos(gR)*Math.cos(bR)*G,
    Math.sin(bR)*G
  );
}

/* ── Create physics objects ── */
function createObjects() {
  const oM=new CANNON.Material('o');
  OBJ_DEFS.forEach((def,i)=>{
    /* オブジェクトの大きさぶん壁から離してスポーン */
    const halfSize=def.type==='coin'?def.r:Math.max(def.bw,def.bd)/2;
    const sx=(Math.random()-.5)*Math.max(.15,W-2*halfSize-.5);
    const sz=(Math.random()-.5)*Math.max(.3,D-2*halfSize-.8);

    /* Three.js mesh */
    let mesh;
    if(def.type==='coin'){
      const geom=new THREE.CylinderGeometry(def.r,def.r,def.h,36);
      const mat=new THREE.MeshStandardMaterial({map:makeCoinTex(def.value),roughness:.28,metalness:def.value===500?.82:.62});
      mesh=new THREE.Mesh(geom,mat);
    } else {
      const geom=new THREE.BoxGeometry(def.bw,def.h,def.bd);
      const mat=new THREE.MeshStandardMaterial({map:makeBillTex(def.value),roughness:.72,metalness:.02});
      mesh=new THREE.Mesh(geom,mat);
      mesh.rotation.y=(Math.random()-.5)*.5;
    }
    mesh.castShadow=true; mesh.receiveShadow=true;
    scene3.add(mesh);

    /* Cannon body */
    const body=new CANNON.Body({mass:def.mass,material:oM});
    if(def.type==='coin'){
      // Thin CANNON.Cylinder is unstable → use flat Box (coin lies flat on XZ plane)
      // Box half-extents: (r*0.72, h/2, r*0.72) stays inside the visual circle
      body.addShape(new CANNON.Box(new CANNON.Vec3(def.r*.72, def.h/2, def.r*.72)));
    } else {
      body.addShape(new CANNON.Box(new CANNON.Vec3(def.bw/2,def.h/2,def.bd/2)));
      const q=new CANNON.Quaternion();
      q.setFromAxisAngle(new CANNON.Vec3(0,1,0),mesh.rotation.y);
      body.quaternion.copy(q);
    }
    body.position.set(sx, def.h/2+.06+i*.09, sz);
    body.linearDamping=def.ldam;
    // High angular damping: prevent coins from standing on edge
    body.angularDamping=def.type==='coin'?0.85:def.adam;
    // Keep awake to always respond to gravity changes
    body.allowSleep=false;
    physWorld.addBody(body);

    physObjs.push({def, body, mesh, origMass:def.mass});
  });
}

/* ══════════════════════════════════════
   GYROSCOPE
══════════════════════════════════════ */
function initGyro() {
  if(gyroReady) return;
  const h=e=>{rawBeta=e.beta??90;rawGamma=e.gamma??0;};
  if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
    DeviceOrientationEvent.requestPermission().then(s=>{
      if(s==='granted'){window.addEventListener('deviceorientation',h,true);gyroReady=true;}
    }).catch(()=>{});
  } else {
    window.addEventListener('deviceorientation',h,true);gyroReady=true;
  }
}

/* ══════════════════════════════════════
   MEDIAPIPE
══════════════════════════════════════ */
function initMP() {
  hidVid=document.createElement('video');
  hidVid.setAttribute('playsinline','');
  hidVid.style.cssText='position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;top:0;left:0;';
  document.body.appendChild(hidVid);

  mpHands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${f}`});
  mpHands.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:.65,minTrackingConfidence:.55});
  mpHands.onResults(onResults);

  mpCam=new Camera(hidVid,{
    onFrame:async()=>{await mpHands.send({image:hidVid});},
    width:640,height:480,facingMode:'user',
  });
  mpCam.start().then(()=>{
    statusEl.textContent='傾けて転がす・ピンチでつかむ';
  }).catch(err=>{
    loadingOvl.classList.add('hidden');
    statusEl.textContent='カメラエラー: '+(err.message||String(err));
  });
}

/* ── Landmark helpers ── */
function d2(a,b){const dx=a.x-b.x,dy=a.y-b.y;return Math.sqrt(dx*dx+dy*dy);}
// 複数ランドマーク平均でスケール計測 → ピンチ姿勢変化による誤差を低減
function handScale(lm){
  return (d2(lm[0],lm[5])+d2(lm[0],lm[9])+d2(lm[0],lm[13]))/3;
}
function pinchRat(lm){const h=handScale(lm);return h>1e-3?d2(lm[4],lm[8])/h:1;}
function pinchCtr(lm){return{x:(lm[4].x+lm[8].x)/2,y:(lm[4].y+lm[8].y)/2};}

/* ── Find object under screen point ──
   レイキャストでメッシュ形状と正確に交差判定。
   外れた場合のみ、実サイズ+わずかな救済マージンで最寄りを拾う */
function findObjAt(sx,sy) {
  const ndx=(sx/innerWidth)*2-1, ndy=-((sy/innerHeight)*2-1);
  const rc=new THREE.Raycaster();
  rc.setFromCamera(new THREE.Vector2(ndx,ndy),cam3);

  const candidates=physObjs.filter(o=>o!==grabbed?.obj);
  const hits=rc.intersectObjects(candidates.map(o=>o.mesh),false);
  if(hits.length){
    const hit=candidates.find(o=>o.mesh===hits[0].object);
    if(hit) return hit;
  }

  /* grace fallback: レイとオブジェクト中心の距離を実サイズで正規化して判定 */
  let best=null,bestScore=1;
  const pt=new THREE.Vector3();
  for(const o of candidates){
    const objR=o.def.type==='coin'?o.def.r:Math.min(o.def.bw,o.def.bd)/2;
    rc.ray.closestPointToPoint(o.mesh.position,pt);
    const score=pt.distanceTo(o.mesh.position)/(objR+.12);
    if(score<bestScore){bestScore=score;best=o;}
  }
  return best;
}

/* ── Unproject screen → world at height Y ── */
function screenToWorld(sx,sy,targetY) {
  const ndx=(sx/innerWidth)*2-1, ndy=-((sy/innerHeight)*2-1);
  const rc=new THREE.Raycaster();
  rc.setFromCamera(new THREE.Vector2(ndx,ndy),cam3);
  const pl=new THREE.Plane(new THREE.Vector3(0,1,0),-targetY);
  const pt=new THREE.Vector3();
  return rc.ray.intersectPlane(pl,pt)?pt:null;
}

/* ── Hand results ── */
function onResults(res) {
  const lmArr=res.multiHandLandmarks;
  if(!lmArr||lmArr.length===0){
    if(grabbed) releaseGrab();
    wasPinching=false; pinchStreak=0; pinchDot.style.display='none'; return;
  }
  const lm=lmArr[0], pr=pinchRat(lm), pc=pinchCtr(lm);
  /* ヒステリシス: つかむ時は厳しく(0.22)、保持中は緩く(0.34) */
  const thresh=grabbed?0.34:0.22;
  const pinchingNow=pr<thresh;
  pinchStreak=pinchingNow?pinchStreak+1:0;
  /* 2フレーム連続でピンチ確定 → トラッキングノイズによる誤グラブを防ぐ */
  const pinching=grabbed?pinchingNow:pinchStreak>=2;
  const sx=(1-pc.x)*innerWidth, sy=pc.y*innerHeight;
  pinchSX=sx; pinchSY=sy;

  pinchDot.style.display=pinching?'block':'none';
  if(pinching){pinchDot.style.left=sx+'px';pinchDot.style.top=sy+'px';}

  /* Pinch START */
  if(pinching&&!wasPinching&&!grabbed){
    const obj=findObjAt(sx,sy);
    if(obj){
      grabbed={obj,grabHandSz:handScale(lm),baseY:obj.body.position.y};
      /* Make body kinematic so physics doesn't fight us */
      obj.body.type=CANNON.Body.KINEMATIC;
      obj.body.velocity.set(0,0,0);
      obj.body.angularVelocity.set(0,0,0);
      statusEl.textContent=`${obj.def.label}をつかんだ！`;
      infoVal.textContent=obj.def.label;
      const cdStr=obj.def.cdRatio>=1?'軽い':obj.def.cdRatio>=.6?'普通':obj.def.cdRatio>=.3?'重い':'超重い！';
      infoCd.textContent=`CD×${obj.def.cdRatio}(${cdStr})`;
    }
  }
  /* Pinch END */
  if(!pinching&&wasPinching&&grabbed) releaseGrab();
  wasPinching=pinching;

  /* Lift fraction — use multi-landmark scale, threshold 0.18 for sensitivity */
  if(grabbed&&pinching){
    const curScale=handScale(lm);
    const szRatio=curScale/Math.max(grabbed.grabHandSz,1e-4);
    liftFracRaw=Math.min(Math.max(0,(1-szRatio)/.18),1.0);
  } else if(!grabbed){
    liftFracRaw=0;
  }
}

function releaseGrab() {
  if(!grabbed) return;
  const {obj}=grabbed;
  /* Re-enable physics */
  obj.body.type=CANNON.Body.DYNAMIC;
  obj.body.mass=obj.origMass;
  obj.body.updateMassProperties();
  obj.body.velocity.set((Math.random()-.5)*.5,-1.0,(Math.random()-.5)*.5);
  obj.body.wakeUp&&obj.body.wakeUp();
  /* Sync body position from mesh */
  obj.body.position.copy(obj.mesh.position);
  grabbed=null; liftFrac=0; animLift=0;
  statusEl.textContent='傾けて転がす・ピンチでつかむ';
  infoVal.textContent='---'; infoCd.textContent='';
}

/* ══════════════════════════════════════
   RENDER LOOP
══════════════════════════════════════ */
function renderLoop(ts) {
  if(sApp.style.display!=='block') return;

  /* Gyro smooth */
  smBeta  +=(rawBeta -smBeta) *.12;
  smGamma +=(rawGamma-smGamma)*.12;

  /* Update gravity */
  if(physWorld) updateGravity(smBeta,smGamma);

  /* Physics step */
  const dt=lastTs?Math.min((ts-lastTs)/1000,.05):1/60;
  lastTs=ts;
  if(physWorld) physWorld.step(1/60,dt,3);

  /* Smooth liftFrac (EMA) to reduce jitter from hand tracking */
  liftFrac+=(liftFracRaw-liftFrac)*.22;

  /* Sync Three.js ↔ Cannon + hard-clamp inside wallet */
  const hWc=W/2-.04, hDc=D/2-.04;
  for(const o of physObjs){
    if(o===grabbed?.obj) continue;
    // Failsafe: push back inside if somehow escaped
    if(o.body.position.x<-hWc||o.body.position.x>hWc||
       o.body.position.z<-hDc||o.body.position.z>hDc){
      o.body.position.x=Math.max(-hWc,Math.min(hWc,o.body.position.x));
      o.body.position.z=Math.max(-hDc,Math.min(hDc,o.body.position.z));
      o.body.velocity.set(0,o.body.velocity.y,0);
    }
    o.mesh.position.copy(o.body.position);
    o.mesh.quaternion.set(o.body.quaternion.x,o.body.quaternion.y,o.body.quaternion.z,o.body.quaternion.w);
  }

  /* Grabbed object: manual position */
  if(grabbed){
    const obj=grabbed.obj, def=obj.def;
    const rawLift=liftFrac*BASE_LIFT*def.cdRatio;
    const targetY=Math.min(def.h/2+rawLift, WH-.12);
    animLift+=(targetY-animLift)*.14;

    const wp=screenToWorld(pinchSX,pinchSY,animLift);
    if(wp){
      /* オブジェクトの実サイズぶん壁の内側にクランプ */
      const halfX=def.type==='coin'?def.r:def.bw/2;
      const halfZ=def.type==='coin'?def.r:def.bd/2;
      const hW=Math.max(.1,W/2-halfX-.03), hD=Math.max(.1,D/2-halfZ-.03);
      wp.x=Math.max(-hW,Math.min(hW,wp.x));
      wp.z=Math.max(-hD,Math.min(hD,wp.z));
      obj.mesh.position.set(wp.x,animLift,wp.z);
      /* Keep body in sync for collision */
      obj.body.position.set(wp.x,animLift,wp.z);
      obj.body.velocity.set(0,0,0);
      obj.body.angularVelocity.set(0,0,0);
    }
    liftFill.style.height=(liftFrac*100).toFixed(0)+'%';
  } else {
    liftFill.style.height='0%';
  }

  /* Camera fixed — gyro affects only physics gravity, not background */

  if(renderer3&&scene3&&cam3) renderer3.render(scene3,cam3);
  rafHandle=requestAnimationFrame(renderLoop);
}
</script>
